<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Publicar vehículo en AutoMarket">

    <title>AutoMarket | Publicar vehículo</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container nav-container">

            <a href="index.html"
               class="logo">

                <span>Auto</span>Market

            </a>


            <nav class="navbar">

                <a href="index.html">
                    Inicio
                </a>

                <a href="catalogo.html">
                    Catálogo
                </a>

                <a href="publicar.html"
                   class="active">

                    Publicar vehículo

                </a>

                <a href="contacto.html">
                    Contacto
                </a>

            </nav>

        </div>

    </header>


    <main>

        <section class="page-header">

            <div class="container">

                <span>
                    AutoMarket
                </span>

                <h1>
                    Publicar vehículo
                </h1>

                <p>
                    Registra un vehículo para mostrarlo en nuestro catálogo.
                </p>

            </div>

        </section>


        <section class="section">

            <div class="container">

                <div class="form-container">

                    <div class="section-title">

                        <span>
                            Nuevo vehículo
                        </span>

                        <h2>
                            Completa la información
                        </h2>

                    </div>


                    <form id="formPublicar">

                        <div class="form-row">

                            <div class="form-group">

                                <label for="marca">
                                    Marca *
                                </label>

                                <input
                                    type="text"
                                    id="marca"
                                    required
                                    placeholder="Ej. Toyota">

                            </div>


                            <div class="form-group">

                                <label for="modelo">
                                    Modelo *
                                </label>

                                <input
                                    type="text"
                                    id="modelo"
                                    required
                                    placeholder="Ej. Corolla">

                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="anio">
                                    Año *
                                </label>

                                <input
                                    type="number"
                                    id="anio"
                                    min="1990"
                                    max="2026"
                                    required
                                    placeholder="2024">

                            </div>


                            <div class="form-group">

                                <label for="precio">
                                    Precio *
                                </label>

                                <input
                                    type="number"
                                    id="precio"
                                    min="0"
                                    required
                                    placeholder="25000">

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="caracteristicas">
                                Características *
                            </label>

                            <input
                                type="text"
                                id="caracteristicas"
                                required
                                placeholder="Ej. Automático, gasolina, 5 puertas">

                        </div>


                        <div class="form-group">

                            <label for="descripcion">
                                Descripción *
                            </label>

                            <textarea
                                id="descripcion"
                                rows="6"
                                required
                                placeholder="Describe el vehículo..."></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary">

                            Publicar vehículo

                        </button>

                    </form>


                    <div
                        id="mensajePublicacion"
                        class="form-message">

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="container footer-content">

            <div>

                <a href="index.html"
                   class="logo">

                    <span>Auto</span>Market

                </a>

                <p>
                    Plataforma web para la gestión y venta de vehículos.
                </p>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 AutoMarket.
            </p>

        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
